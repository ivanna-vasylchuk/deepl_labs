[project]
name = "lab4"
version = "0.1.0"
description = "ЛР4: FP32 проти INT8 (статична квантизація ONNX Runtime)"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.15.0",
    "torchvision==0.29.2",
    "onnx==1.23.2",
    "onnxruntime==1.31.1",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "pillow==13.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
