[project]
name = "lab3"
version = "0.1.0"
description = "ЛР3: обчислювальний експеримент і трансферне навчання"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.5.4",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "pillow==13.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
