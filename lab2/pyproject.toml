[project]
name = "lab2"
version = "0.1.0"
description = "ЛР2: поріг рішення під асиметричну ціну помилок"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "torch==2.14.1",
    "matplotlib==3.11.2",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
